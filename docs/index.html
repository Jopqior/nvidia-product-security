<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NVIDIA Product Security - Filtered CVEs</title>
  <style>:root {
  --bg: #f7f7f2;
  --panel: #ffffff;
  --ink: #1e2421;
  --muted: #617069;
  --line: #d7ddd7;
  --accent: #005f73;
  --accent-soft: #e8f4f6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  background: linear-gradient(180deg, #f7f7f2 0%, #eef3ef 100%);
  color: var(--ink);
}
.wrapper {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 18px 42px;
}
.header {
  margin-bottom: 24px;
}
.header h1 {
  margin: 0;
  font-size: 2.1rem;
  letter-spacing: 0.3px;
}
.subtitle {
  margin: 8px 0 0;
  color: var(--muted);
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(21, 28, 25, 0.05);
}
.list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.list li {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.list li:last-child { border-bottom: 0; }
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover { text-decoration: underline; }
.badge {
  display: inline-block;
  font-size: 0.82rem;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid #c7e4ea;
  border-radius: 999px;
  padding: 2px 10px;
  margin-left: 8px;
}
.kv {
  color: var(--muted);
  font-size: 0.92rem;
  margin-top: 4px;
}
.cve-title {
  margin: 0;
  font-size: 1.15rem;
}
.desc {
  margin: 8px 0 0;
  line-height: 1.45;
}
.footer {
  margin-top: 28px;
  color: var(--muted);
  font-size: 0.9rem;
}
@media (max-width: 700px) {
  .header h1 { font-size: 1.7rem; }
}</style>
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <h1>NVIDIA Product Security - Filtered CVEs</h1>
      <p class="subtitle">Memory-safety related CVEs generated from the filter folder</p>
    </header>
    <section class="panel">
<ul class="list">
<li><a href="./2022/index.html">2022</a><span class="badge">11 bulletins</span><span class="badge">37 CVEs</span></li>
<li><a href="./2023/index.html">2023</a><span class="badge">10 bulletins</span><span class="badge">23 CVEs</span></li>
<li><a href="./2024/index.html">2024</a><span class="badge">10 bulletins</span><span class="badge">23 CVEs</span></li>
<li><a href="./2025/index.html">2025</a><span class="badge">11 bulletins</span><span class="badge">49 CVEs</span></li>
<li><a href="./2026/index.html">2026</a><span class="badge">1 bulletins</span><span class="badge">2 CVEs</span></li>
</ul>
</section>
    <footer class="footer">Generated from filter folder for GitHub Pages.</footer>
  </main>
</body>
</html>
